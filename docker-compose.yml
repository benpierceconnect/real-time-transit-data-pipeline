name: real-time-transit-data-pipeline

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transit_demo}
      MYSQL_USER: ${MYSQL_APP_USER:-transit_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      DEBEZIUM_USER: ${DEBEZIUM_USER:-debezium}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?Set DEBEZIUM_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -p"$${MYSQL_ROOT_PASSWORD}" ping --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [transit]

  mongo:
    image: mongo:8.0.29-noble
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [transit]

  cdc-service:
    build:
      context: ./cdc-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transit_demo}
      MYSQL_TABLE: vehicle_observations
      DEBEZIUM_USER: ${DEBEZIUM_USER:-debezium}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?Set DEBEZIUM_PASSWORD in .env}
      DEBEZIUM_SERVER_ID: ${DEBEZIUM_SERVER_ID:-184054}
      DEBEZIUM_OFFSET_FILE: /state/offsets.dat
      DEBEZIUM_SCHEMA_HISTORY_FILE: /state/schema-history.dat
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-transit_demo}
      CDC_HEALTH_PORT: ${CDC_HEALTH_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${CDC_HEALTH_PORT:-8080}:8080"
    volumes:
      - cdc-state:/state
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/transit-cdc-service.jar", "com.benpierce.transitcdc.Healthcheck", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s
    networks: [transit]

  collector:
    build:
      context: ./collector
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transit_demo}
      MYSQL_USER: ${MYSQL_APP_USER:-transit_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      COLLECTOR_MODE: ${COLLECTOR_MODE:-synthetic}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-10}
      TRANSIT_API_URL: ${TRANSIT_API_URL:-https://api-v3.mbta.com/vehicles?filter[route]=1&include=trip}
      TRANSIT_API_KEY: ${TRANSIT_API_KEY:-}
      SYNTHETIC_SNAPSHOT_PATH: ${SYNTHETIC_SNAPSHOT_PATH:-/data/fixtures/synthetic_vehicle_snapshot.json}
      SYNTHETIC_REFRESH_TIMESTAMPS: ${SYNTHETIC_REFRESH_TIMESTAMPS:-true}
      REPLAY_CSV_PATH: ${REPLAY_CSV_PATH:-/data/sample/synthetic_trip_observations.csv}
      REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-25}
      REPLAY_DELAY_SECONDS: ${REPLAY_DELAY_SECONDS:-0.25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      cdc-service:
        condition: service_healthy
    networks: [transit]

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-transit_demo}
      WEB_PORT: ${WEB_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      DATA_MODE: ${COLLECTOR_MODE:-synthetic}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
      cdc-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [transit]

volumes:
  mysql-data:
  mongo-data:
  cdc-state:

networks:
  transit:
    driver: bridge
