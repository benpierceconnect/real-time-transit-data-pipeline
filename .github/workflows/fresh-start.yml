name: Fresh-start integration

on:
  workflow_dispatch:

jobs:
  empty-volume-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt -r collector/requirements.txt -r web/requirements.txt
      - run: python scripts/secret_scan.py --public-files
      - run: cp .env.example .env
      - name: Set disposable CI-only credentials
        run: |
          sed -i 's/change-me-root-password/ci-root-password-2026/' .env
          sed -i 's/change-me-app-password/ci-app-password-2026/' .env
          sed -i 's/change-me-cdc-password/ci-cdc-password-2026/' .env
      - run: docker compose --env-file .env config --quiet
      - run: python scripts/validate_fresh_start.py --confirm-reset --timeout-seconds 300
      - name: Docker diagnostics
        if: failure()
        run: |
          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --tail 300 mysql cdc-service collector mongo web || true
      - name: Remove local test credentials
        if: always()
        run: rm -f .env
